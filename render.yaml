services:
  - type: web
    name: nasi-lemak-online
    runtime: node
    branch: claude/nasi-lemak-online-game-k1qte5
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: ROOM_STORE_PATH
        value: /tmp/nasi-lemak-rooms
      - key: ALLOWED_ORIGINS
        value: ''
